name: Input data tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  data:
    name: Validate language data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate datasets
        run: python tools/validate_data.py

      - name: Test prediction engine
        run: python -m unittest -v tests/test_predictions.py

  keyboard-preview:
    name: Build kk-Arab keyboard preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout data repository
        uses: actions/checkout@v4

      - name: Checkout keyboard layouts
        uses: actions/checkout@v4
        with:
          repository: Agisight/ios-system-keyboard
          path: _keyboard

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preview dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Build interactive preview
        run: |
          python preview/kk-Arab/build_preview.py \
            --keyboard-repo _keyboard \
            --output preview/kk-Arab/dist/index.html

      - name: Smoke-test generated preview
        run: python tools/check_preview.py preview/kk-Arab/dist/index.html

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: kk-Arab-preview
          path: preview/kk-Arab/dist/index.html
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview/kk-Arab/dist

  deploy:
    name: Deploy preview to GitHub Pages
    if: github.event_name != 'pull_request'
    needs:
      - data
      - keyboard-preview

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4